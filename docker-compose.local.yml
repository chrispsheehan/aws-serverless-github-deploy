services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: migrations-local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      AWS_REGION: eu-west-2
    volumes:
      - .:/workspace
    restart: unless-stopped

  lambda_api:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: lambda-api-local
    depends_on:
      migrations:
        condition: service_started
    environment:
      AWS_REGION: eu-west-2
      PORT: "8080"
      LOCAL_API_HARNESS_PORT: "8080"
    volumes:
      - .:/workspace
    ports:
      - "18080:8080"
    restart: unless-stopped

  lambda_worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: lambda-worker-local
    depends_on:
      migrations:
        condition: service_started
    environment:
      AWS_REGION: eu-west-2
      LOCAL_INVOKE_FUNCTION_NAME: lambda_worker
      LOCAL_INVOKE_REQUEST_ID: local-lambda-worker-request
    volumes:
      - .:/workspace
    restart: "no"

  debug:
    build:
      context: .
      dockerfile: Dockerfile
      target: debug
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_started
      lambda_api:
        condition: service_started
      lambda_worker:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: app
      PGUSER: app
      PGPASSWORD: app
    volumes:
      - .:/workspace
    working_dir: /workspace

volumes:
  postgres_data:
