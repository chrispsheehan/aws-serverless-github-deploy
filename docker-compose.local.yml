services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  elasticmq:
    image: softwaremill/elasticmq-native:1.5.12
    ports:
      - "19324:9324"
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro
    command: ["-Dconfig.file=/opt/elasticmq.conf"]

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: migrations-local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      AWS_REGION: eu-west-2
    volumes:
      - .:/workspace
    restart: unless-stopped

  lambda_api:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: lambda-api-local
    depends_on:
      migrations:
        condition: service_started
    environment:
      AWS_REGION: eu-west-2
      PORT: "8080"
      LOCAL_API_HARNESS_PORT: "8080"
    volumes:
      - .:/workspace
    ports:
      - "18080:8080"
    restart: unless-stopped

  lambda_worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: lambda-worker-local
    depends_on:
      migrations:
        condition: service_started
    environment:
      AWS_REGION: eu-west-2
      LOCAL_INVOKE_FUNCTION_NAME: lambda_worker
      LOCAL_INVOKE_REQUEST_ID: local-lambda-worker-request
    volumes:
      - .:/workspace
    restart: "no"

  ecs_api:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: ecs-api-local
    depends_on:
      migrations:
        condition: service_started
    environment:
      AWS_REGION: eu-west-2
      AWS_SERVICE_NAME: ecs-service-api-local
      IMAGE: local-ecs-api
      PORT: "8080"
      ROOT_PATH: ""
    volumes:
      - .:/workspace
    ports:
      - "18081:8080"
    restart: unless-stopped

  ecs_worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: ecs-worker-local
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_started
      elasticmq:
        condition: service_started
    environment:
      AWS_REGION: eu-west-2
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      AWS_SQS_QUEUE_URL: http://elasticmq:9324/000000000000/worker-events
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
      POLL_TIMEOUT: "5"
      HEARTBEAT_FILE: /tmp/worker-heartbeat
    volumes:
      - .:/workspace
    restart: unless-stopped

  debug:
    build:
      context: .
      dockerfile: Dockerfile
      target: debug
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_started
      lambda_api:
        condition: service_started
      lambda_worker:
        condition: service_completed_successfully
      ecs_api:
        condition: service_started
      ecs_worker:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: app
      PGUSER: app
      PGPASSWORD: app
    volumes:
      - .:/workspace
    working_dir: /workspace

volumes:
  postgres_data:
