name: Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - prod
      allow_prod_cleanup:
        description: "Also run prod-only cleanup and destroy jobs that are normally skipped for prod"
        required: true
        type: boolean
        default: false

concurrency: # only run destroy when no other deploy/destroy is running for the same environment
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

env:
  TF_VAR_lambda_version: this
  AWS_OIDC_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ inputs.environment }}-github-oidc-role
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  generate_waves:
    name: Discover Waves
    uses: ./.github/workflows/shared_get_modules.yml
    with:
      environment: ${{ inputs.environment }}
      infra_version: ${{ github.sha }}

  prepare_waves:
    name: Prepare Destroy Waves
    needs: generate_waves
    runs-on: ubuntu-latest
    outputs:
      waves_json: ${{ steps.filter.outputs.waves_json }}
      wave_0_modules: ${{ steps.filter.outputs.wave_0_modules }}
      wave_1_modules: ${{ steps.filter.outputs.wave_1_modules }}
      wave_2_modules: ${{ steps.filter.outputs.wave_2_modules }}
      wave_3_modules: ${{ steps.filter.outputs.wave_3_modules }}
    steps:
      - name: Filter destroy waves
        id: filter
        shell: bash
        env:
          RAW_WAVES_JSON: ${{ needs.generate_waves.outputs.waves_json }}
          ENVIRONMENT: ${{ inputs.environment }}
          ALLOW_PROD_CLEANUP: ${{ inputs.allow_prod_cleanup }}
        run: |
          FILTERED_WAVES_JSON="$(jq -c '
            if $environment == "prod" and ($allow_prod_cleanup | not) then
              map(.modules |= map(select(. != "code_bucket" and . != "ecr")))
            else
              .
            end
            | map(select(.modules | length > 0))
          ' --arg environment "$ENVIRONMENT" --argjson allow_prod_cleanup "$ALLOW_PROD_CLEANUP" <<<"$RAW_WAVES_JSON")"

          echo "waves_json=$FILTERED_WAVES_JSON" >> "$GITHUB_OUTPUT"
          echo "wave_0_modules=$(jq -c '.[0].modules // []' <<<"$FILTERED_WAVES_JSON")" >> "$GITHUB_OUTPUT"
          echo "wave_1_modules=$(jq -c '.[1].modules // []' <<<"$FILTERED_WAVES_JSON")" >> "$GITHUB_OUTPUT"
          echo "wave_2_modules=$(jq -c '.[2].modules // []' <<<"$FILTERED_WAVES_JSON")" >> "$GITHUB_OUTPUT"
          echo "wave_3_modules=$(jq -c '.[3].modules // []' <<<"$FILTERED_WAVES_JSON")" >> "$GITHUB_OUTPUT"

      - name: Print destroy wave matrix
        shell: bash
        env:
          WAVES_JSON: ${{ steps.filter.outputs.waves_json }}
        run: |
          {
            echo "## Destroy Wave Matrix"
            echo
            echo '```json'
            printf '%s\n' "$WAVES_JSON" | jq .
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wave_3:
    name: 3 / ${{ matrix.module }}
    needs: prepare_waves
    if: ${{ needs.prepare_waves.outputs.wave_3_modules != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare_waves.outputs.wave_3_modules) }}
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy ${{ matrix.module }} infra
        uses: ./.github/actions/terragrunt
        env:
          TF_VAR_image_uri: ${{ startsWith(matrix.module, 'task_') && 'destroy-placeholder' || '' }}
          TF_VAR_debug_image_uri: ${{ startsWith(matrix.module, 'task_') && 'destroy-placeholder' || '' }}
          TF_VAR_aws_otel_collector_image_uri: ${{ startsWith(matrix.module, 'task_') && 'destroy-placeholder' || '' }}
        with:
          tg_directory: infra/live/${{ inputs.environment }}/aws/${{ matrix.module }}
          tg_action: destroy

  wave_2:
    name: 2 / ${{ matrix.module }}
    needs:
      - prepare_waves
      - wave_3
    if: ${{ always() && needs.prepare_waves.outputs.wave_2_modules != '[]' && (needs.wave_3.result == 'success' || needs.wave_3.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare_waves.outputs.wave_2_modules) }}
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy ${{ matrix.module }} infra
        uses: ./.github/actions/terragrunt
        with:
          tg_directory: infra/live/${{ inputs.environment }}/aws/${{ matrix.module }}
          tg_action: destroy

  wave_1:
    name: 1 / ${{ matrix.module }}
    needs:
      - prepare_waves
      - wave_2
    if: ${{ always() && needs.prepare_waves.outputs.wave_1_modules != '[]' && (needs.wave_2.result == 'success' || needs.wave_2.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare_waves.outputs.wave_1_modules) }}
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy ${{ matrix.module }} infra
        uses: ./.github/actions/terragrunt
        with:
          tg_directory: infra/live/${{ inputs.environment }}/aws/${{ matrix.module }}
          tg_action: destroy

  wave_0:
    name: 0 / ${{ matrix.module }}
    needs:
      - prepare_waves
      - wave_1
    if: ${{ always() && needs.prepare_waves.outputs.wave_0_modules != '[]' && (needs.wave_1.result == 'success' || needs.wave_1.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare_waves.outputs.wave_0_modules) }}
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy ${{ matrix.module }} infra
        uses: ./.github/actions/terragrunt
        with:
          tg_directory: infra/live/${{ inputs.environment }}/aws/${{ matrix.module }}
          tg_action: destroy

  cleanup:
    name: Cleanup
    if: inputs.environment != 'prod' || inputs.allow_prod_cleanup
    needs:
      - wave_0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Warn before prod tagged cleanup
        if: inputs.environment == 'prod'
        run: |
          printf '\033[1;31m%s\033[0m\n' 'WARNING: running retained tagged-resource cleanup for prod.'
          printf '%s\n' 'This may delete leaked Cognito user pools and deregister tagged ECS task-definition revisions.'

      - name: Count tagged resources
        id: count-tagged
        uses: ./.github/actions/just
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          ALLOW_PROD_CLEANUP: ${{ inputs.allow_prod_cleanup }}
        with:
          justfile_path: justfile.destroy
          just_action: count-tagged-resources

      - name: Warn when tagged resources remain
        if: steps.count-tagged.outputs.just_outputs != '0'
        run: |
          printf '\033[1;33m%s\033[0m\n' "WARNING: found ${{ steps.count-tagged.outputs.just_outputs }} tagged resources after destroy."

      - name: Cleanup tagged resources
        id: cleanup-tagged
        if: steps.count-tagged.outputs.just_outputs != '0'
        continue-on-error: true
        uses: ./.github/actions/just
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          ALLOW_PROD_CLEANUP: ${{ inputs.allow_prod_cleanup }}
        with:
          justfile_path: justfile.destroy
          just_action: cleanup-tagged-resources

      - name: Warn when tagged cleanup leaves leftovers
        if: steps.cleanup-tagged.outcome == 'failure'
        run: |
          echo "::warning title=Tagged cleanup incomplete::Tagged resources still remained after the post-destroy cleanup step. Review the Cleanup job logs for the unsupported or still-live ARNs."
          {
            echo "## Tagged Cleanup Warning"
            echo
            echo "The post-destroy tagged-resource cleanup reported leftovers."
            echo "Review the Cleanup job logs for the unsupported or still-live ARNs."
          } >> "$GITHUB_STEP_SUMMARY"
