name: Shared Infra

on:
  workflow_call:
    inputs:
      environment:
        description: environment reference i.e. 'prod' or 'dev'
        required: true
        type: string
      infra_version:
        description: "Version of infrastructure (terraform) to be deployed"
        required: true
        type: string
      code_bucket:
        description: "Bucket containing build artifacts"
        required: true
        type: string
      bootstrap_image_uri:
        description: "Bootstrap ECS image URI"
        required: false
        type: string
        default: ""
      lambda_matrix:
        required: false
        type: string
        default: "[]"
      service_matrix:
        required: false
        type: string
        default: "[]"
      tg_action:
        description: "Terragrunt action to run across the infra graph"
        required: false
        type: string
        default: "apply"
      plan_run_id:
        description: "Optional unique run id used to derive saved plan artifact paths"
        required: false
        type: string
        default: ""


concurrency: # only run one instance of workflow at any one time
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_OIDC_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ inputs.environment }}-github-oidc-role
  AWS_REGION: ${{ vars.AWS_REGION }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
  PLAN_BUCKET: ${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}-${{ vars.PROJECT_NAME }}-tfplan
  TG_ENABLE_PLAN_ARTIFACTS: ${{ (inputs.tg_action == 'plan' || inputs.tg_action == 'apply_plan') && 'true' || 'false' }}
  PLAN_ARTIFACT_RUN_ID: ${{ inputs.plan_run_id }}
  TG_ACTION_LABEL: ${{ (inputs.tg_action == 'apply' || inputs.tg_action == 'apply_plan') && 'Apply' || inputs.tg_action == 'plan' && 'Plan' || inputs.tg_action == 'destroy' && 'Destroy' || inputs.tg_action == 'init' && 'Init' || 'Run' }}

jobs:
  changed_items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.infra_version }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render Terragrunt graph
        id: tg_graph
        uses: ./.github/actions/terragrunt
        with:
          tg_directory: infra/live/${{ inputs.environment }}/aws
          tg_action: graph

      - name: Write graph JSON for filter helper
        shell: bash
        env:
          TG_GRAPH_JSON: ${{ steps.tg_graph.outputs.tg_graph_json }}
        run: |
          printf '%s\n' "$TG_GRAPH_JSON" > "$RUNNER_TEMP/terragrunt-graph.json"

      - name: Run changed-items helper
        id: changed_items_json
        uses: ./.github/actions/just
        env:
          TG_GRAPH_METADATA_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          BUCKET_NAME: ${{ env.PLAN_BUCKET }}
        with:
          aws_region: ${{ env.AWS_REGION }}
          justfile_path: justfile.ci
          just_action: tg-graph-changed-items-json $RUNNER_TEMP/terragrunt-graph.json ${{ inputs.environment }}

      - name: Print changed Terragrunt graph items
        shell: bash
        env:
          CHANGED_ITEMS_JSON: ${{ steps.changed_items_json.outputs.just_outputs }}
        run: |
          printf '%s\n' "$CHANGED_ITEMS_JSON" | tee changed-items.json
          {
            echo "## Changed Terragrunt Graph Items"
            echo
            echo '```json'
            cat changed-items.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Previous shared infra rollout jobs are intentionally disabled for this
  # temporary graph-debug shape. Restore the ordered per-stack jobs after the
  # changed-items output is wired into the next iteration.
