name: Shared Infra

on:
  workflow_call:
    inputs:
      environment:
        description: environment reference i.e. 'prod' or 'dev'
        required: true
        type: string
      infra_version:
        description: "Version of infrastructure (terraform) to be deployed"
        required: true
        type: string
      bootstrap_image_uri:
        description: "Bootstrap ECS image URI"
        required: false
        type: string
        default: ""
      tg_action:
        description: "Terragrunt action to run across the infra graph"
        required: false
        type: string
        default: "apply"
      plan_run_id:
        description: "Optional unique run id used to derive saved plan artifact paths"
        required: false
        type: string
        default: ""
    outputs:
      waves_json:
        description: "Dependency-safe Terragrunt wave matrix JSON"
        value: ${{ jobs.generate_waves.outputs.waves_json }}
      changed_items_json:
        description: "Deprecated compatibility output; currently mirrors waves_json"
        value: ${{ jobs.generate_waves.outputs.waves_json }}


concurrency: # only run one instance of workflow at any one time
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_OIDC_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ inputs.environment }}-github-oidc-role
  AWS_REGION: ${{ vars.AWS_REGION }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
  PLAN_BUCKET: ${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}-${{ vars.PROJECT_NAME }}-tfplan
  TG_ENABLE_PLAN_ARTIFACTS: ${{ (inputs.tg_action == 'plan' || inputs.tg_action == 'apply_plan') && 'true' || 'false' }}
  PLAN_ARTIFACT_RUN_ID: ${{ inputs.plan_run_id }}
  TG_ACTION_LABEL: ${{ (inputs.tg_action == 'apply' || inputs.tg_action == 'apply_plan') && 'Apply' || inputs.tg_action == 'plan' && 'Plan' || inputs.tg_action == 'destroy' && 'Destroy' || inputs.tg_action == 'init' && 'Init' || 'Run' }}

jobs:
  generate_waves:
    uses: ./.github/workflows/shared_get_modules.yml
    with:
      environment: ${{ inputs.environment }}
      infra_version: ${{ inputs.infra_version }}

  wave_0:
    needs: generate_waves
    if: ${{ needs.generate_waves.outputs.wave_0_modules != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.generate_waves.outputs.wave_0_modules) }}
    steps:
      - name: ${{ matrix.module }}
        run: echo "${{ matrix.module }}"

  wave_1:
    needs:
      - generate_waves
      - wave_0
    if: ${{ always() && needs.generate_waves.outputs.wave_1_modules != '[]' && (needs.wave_0.result == 'success' || needs.wave_0.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.generate_waves.outputs.wave_1_modules) }}
    steps:
      - name: ${{ matrix.module }}
        run: echo "${{ matrix.module }}"

  wave_2:
    needs:
      - generate_waves
      - wave_1
    if: ${{ always() && needs.generate_waves.outputs.wave_2_modules != '[]' && (needs.wave_1.result == 'success' || needs.wave_1.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.generate_waves.outputs.wave_2_modules) }}
    steps:
      - name: ${{ matrix.module }}
        run: echo "${{ matrix.module }}"

  # Placeholder wave jobs intentionally stop at logging module arrays. Replace
  # them with real per-wave deployment fanout once the runtime override contract
  # is restored for every stack type.
