name: Shared Infra

on:
  workflow_call:
    inputs:
      environment:
        description: environment reference i.e. 'prod' or 'dev'
        required: true
        type: string
      infra_version:
        description: "Version of infrastructure (terraform) to be deployed"
        required: true
        type: string
      code_bucket:
        description: "Bucket containing build artifacts"
        required: true
        type: string
      bootstrap_image_uri:
        description: "Bootstrap ECS image URI"
        required: false
        type: string
        default: ""
      lambda_matrix:
        required: false
        type: string
        default: "[]"
      service_matrix:
        required: false
        type: string
        default: "[]"
      tg_action:
        description: "Terragrunt action to run across the infra graph"
        required: false
        type: string
        default: "apply"
      plan_run_id:
        description: "Optional unique run id used to derive saved plan artifact paths"
        required: false
        type: string
        default: ""
    outputs:
      waves_json:
        description: "Dependency-safe Terragrunt wave matrix JSON"
        value: ${{ jobs.generate_waves.outputs.waves_json }}
      changed_items_json:
        description: "Deprecated compatibility output; currently mirrors waves_json"
        value: ${{ jobs.generate_waves.outputs.waves_json }}


concurrency: # only run one instance of workflow at any one time
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_OIDC_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ inputs.environment }}-github-oidc-role
  AWS_REGION: ${{ vars.AWS_REGION }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
  PLAN_BUCKET: ${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}-${{ vars.PROJECT_NAME }}-tfplan
  TG_ENABLE_PLAN_ARTIFACTS: ${{ (inputs.tg_action == 'plan' || inputs.tg_action == 'apply_plan') && 'true' || 'false' }}
  PLAN_ARTIFACT_RUN_ID: ${{ inputs.plan_run_id }}
  TG_ACTION_LABEL: ${{ (inputs.tg_action == 'apply' || inputs.tg_action == 'apply_plan') && 'Apply' || inputs.tg_action == 'plan' && 'Plan' || inputs.tg_action == 'destroy' && 'Destroy' || inputs.tg_action == 'init' && 'Init' || 'Run' }}

jobs:
  generate_waves:
    runs-on: ubuntu-latest
    outputs:
      waves_json: ${{ steps.waves_json.outputs.just_outputs }}
      wave_0_modules: ${{ steps.wave_outputs.outputs.wave_0_modules }}
      wave_1_modules: ${{ steps.wave_outputs.outputs.wave_1_modules }}
      wave_2_modules: ${{ steps.wave_outputs.outputs.wave_2_modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.infra_version }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render Terragrunt graph
        id: tg_graph
        uses: ./.github/actions/terragrunt
        with:
          tg_directory: infra/live/${{ inputs.environment }}/aws
          tg_action: graph

      - name: Convert graph output to compact JSON
        id: tg_graph_json
        uses: ./.github/actions/just
        env:
          TG_GRAPH_OUTPUT: ${{ steps.tg_graph.outputs.tg_graph_output }}
        with:
          justfile_path: justfile.ci
          just_action: tg-graph-output-to-json ${{ inputs.environment }}

      - name: Build wave matrix JSON
        id: waves_json
        uses: ./.github/actions/just
        env:
          TG_GRAPH_JSON: ${{ steps.tg_graph_json.outputs.just_outputs }}
        with:
          justfile_path: justfile.ci
          just_action: tg-graph-json-to-waves

      - name: Expose placeholder wave module arrays
        id: wave_outputs
        shell: bash
        env:
          WAVES_JSON: ${{ steps.waves_json.outputs.just_outputs }}
        run: |
          echo "wave_0_modules=$(jq -c '.[0].modules // []' <<<"$WAVES_JSON")" >> "$GITHUB_OUTPUT"
          echo "wave_1_modules=$(jq -c '.[1].modules // []' <<<"$WAVES_JSON")" >> "$GITHUB_OUTPUT"
          echo "wave_2_modules=$(jq -c '.[2].modules // []' <<<"$WAVES_JSON")" >> "$GITHUB_OUTPUT"

      - name: Print Terragrunt wave matrix
        shell: bash
        env:
          WAVES_JSON: ${{ steps.waves_json.outputs.just_outputs }}
        run: |
          printf '%s\n' "$WAVES_JSON" | tee waves.json
          {
            echo "## Terragrunt Wave Matrix"
            echo
            echo '```json'
            cat waves.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wave_0:
    needs: generate_waves
    if: ${{ needs.generate_waves.outputs.wave_0_modules != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder wave 0
        env:
          MODULES: ${{ needs.generate_waves.outputs.wave_0_modules }}
        run: echo "wave_0 modules=$MODULES"

  wave_1:
    needs:
      - generate_waves
      - wave_0
    if: ${{ always() && needs.generate_waves.outputs.wave_1_modules != '[]' && (needs.wave_0.result == 'success' || needs.wave_0.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder wave 1
        env:
          MODULES: ${{ needs.generate_waves.outputs.wave_1_modules }}
        run: echo "wave_1 modules=$MODULES"

  wave_2:
    needs:
      - generate_waves
      - wave_1
    if: ${{ always() && needs.generate_waves.outputs.wave_2_modules != '[]' && (needs.wave_1.result == 'success' || needs.wave_1.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder wave 2
        env:
          MODULES: ${{ needs.generate_waves.outputs.wave_2_modules }}
        run: echo "wave_2 modules=$MODULES"

  # Placeholder wave jobs intentionally stop at logging module arrays. Replace
  # them with real per-wave deployment fanout once the runtime override contract
  # is restored for every stack type.
