name: Dev Infra Plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  infra:
    name: Plan
    uses: ./.github/workflows/shared_infra_plan.yml
    with:
      environment: dev
      infra_version: ${{ github.sha }}
      code_bucket: ""
      lambda_matrix: "[]"
      bootstrap_image_uri: ""
      service_matrix: "[]"
