name: Dev Infra Apply (no plan)

on:
  workflow_dispatch:
  push:
    branches:
      - plan-flow-improve

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  infra:
    name: Apply
    uses: ./.github/workflows/shared_infra_apply_no_plan.yml
    with:
      environment: dev
      infra_version: ${{ github.sha }}
      bootstrap_image_uri: ""
