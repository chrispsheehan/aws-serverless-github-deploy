name: "Execute Terraform & Terragrunt"
description: "Sets up Terraform and Terragrunt and runs a terragrunt action using AWS credentials already configured in the job when needed"

inputs:
  tf_version:
    description: "Version of Terraform to install"
    required: false
    default: "1.13.3"
  tg_version:
    description: "Version of Terragrunt to install"
    required: false
    default: "0.72.6"
  aws_region:
    description: "AWS Region"
    default: "eu-west-2"
  override_tg_vars:
    description: "Override or additional Terragrunt variables in JSON format"
    required: false
    default: "{}"
  tg_directory:
    description: "Module directory to perform action upon"
    required: true
  tg_action:
    description: "Terragrunt action to perform (`apply`, `plan`, `apply_plan`, `destroy`, or `init` for outputs-only)"
    required: true
    default: apply

outputs:
  tg_outputs:
    description: "All Terraform outputs in JSON format"
    value: ${{ steps.tg_outputs.outputs.terraform_json }}

runs:
  using: "composite"
  steps:
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.tf_version }}
        terraform_wrapper: false

    # Install Terragrunt through mise directly so this repo controls the exact
    # setup-action revision and can move faster than third-party wrapper actions
    # when GitHub Action runtime deprecations or nested dependency warnings land.
    - name: Install Terragrunt
      uses: jdx/mise-action@v4
      with:
        tool_versions: |
          terragrunt ${{ inputs.tg_version }}
        github_token: ${{ github.token }}

    - name: Verify Terragrunt installation
      shell: bash
      run: terragrunt --version

    - name: Normalize and write override_tg_vars
      if: inputs.tg_action == 'apply' || inputs.tg_action == 'plan' || inputs.tg_action == 'destroy'
      shell: bash
      env:
        OVERRIDE_TG_VARS: ${{ inputs.override_tg_vars }}
      run: |
        echo "$OVERRIDE_TG_VARS" | jq -c . > ${{ inputs.tg_directory }}/override_tg_vars.tfvars.json

    - name: Action Terragrunt
      id: terragrunt_action
      shell: bash
      env:
        TF_IN_AUTOMATION: true
        TG_PLAN_LOG_FILENAME: terragrunt.plan.log
        TG_PLAN_LOG_ABS_PATH: ${{ github.workspace }}/${{ inputs.tg_directory }}/terragrunt.plan.log
      working-directory: ${{ inputs.tg_directory }}
      run: |
        PLAN_PATH="terragrunt.tfplan"
        PLAN_LOG_PATH="$(pwd)/terragrunt.plan.log"

        case "${{ inputs.tg_action }}" in
          apply)
            terragrunt apply -auto-approve -compact-warnings -var-file=override_tg_vars.tfvars.json
            ;;
          plan)
            set +e
            terragrunt plan -input=false -lock=false -detailed-exitcode -compact-warnings -out="$PLAN_PATH" -var-file=override_tg_vars.tfvars.json 2>&1 | tee "$PLAN_LOG_PATH"
            plan_exit_code=${PIPESTATUS[0]}
            set -e

            if [ "$plan_exit_code" -eq 1 ]; then
              exit 1
            fi

            plan_contains_mocked_outputs=false
            if grep -Fq "mock outputs provided and returning those in dependency output" "$PLAN_LOG_PATH"; then
              plan_contains_mocked_outputs=true
              echo "::warning title=Mock outputs used during plan::Terragrunt used dependency mock outputs while creating a saved plan. This plan artifact should not be used with apply_plan until a fresh plan is created from real upstream outputs."
            fi

            echo "plan_exit_code=$plan_exit_code" >> "$GITHUB_OUTPUT"
            echo "plan_contains_mocked_outputs=$plan_contains_mocked_outputs" >> "$GITHUB_OUTPUT"
            echo "Terragrunt binary plan path in cache: $PLAN_PATH"

            ;;
          apply_plan)
            terragrunt apply -auto-approve "$PLAN_PATH"
            ;;
          destroy)
            terragrunt destroy -auto-approve -compact-warnings -var-file=override_tg_vars.tfvars.json
            ;;
          init)
            echo "Running init only (no infra changes)..."
            terragrunt init -input=false -reconfigure
            ;;
          *)
            echo "Unknown tg_action: '${{ inputs.tg_action }}' (expected: apply|plan|apply_plan|destroy|init)" >&2
            exit 2
            ;;
        esac

    - name: Capture Terraform Outputs
      if: inputs.tg_action != 'destroy'
      id: tg_outputs
      shell: bash
      working-directory: ${{ inputs.tg_directory }}
      run: |
        echo "📤 Capturing all Terraform outputs..."
        if terragrunt output -json >/dev/null 2>&1; then
          TERRAGRUNT_OUTPUTS=$(terragrunt output -json | jq -c)
        else
          echo "ℹ️ No outputs available (no state found)."
          TERRAGRUNT_OUTPUTS="{}"
        fi
        echo "terraform_json=$TERRAGRUNT_OUTPUTS" >> "$GITHUB_OUTPUT"
        echo "✅ Terraform outputs captured successfully."
